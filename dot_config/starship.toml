# Starship config — Solarized Light
# Install: cp starship.toml ~/.config/starship.toml
# Assumes your terminal background is Solarized base3 (#fdf6e3).
# Uses plain Unicode symbols; no Nerd Font required.

"$schema" = "https://starship.rs/config-schema.json"

palette = "solarized_light"
add_newline = true
command_timeout = 500  # keep the prompt snappy in big repos

# Line 1: location + git + toolchain + timing. Line 2: the prompt character.
format = """
$username$hostname\
$directory\
${custom.worktree}\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$nodejs\
$python\
$rust\
$golang\
$bun\
$deno\
$cmd_duration\
$jobs\
$line_break\
$status\
$character"""

right_format = ""

[palettes.solarized_dark]
base03  = "#002b36"
base02  = "#073642"
base01  = "#586e75"   # emphasized content
base00  = "#657b83"   # body text
base0   = "#839496"
base1   = "#93a1a1"   # comments / secondary
base2   = "#eee8d5"   # background highlights
base3   = "#fdf6e3"   # background
yellow  = "#b58900"
orange  = "#cb4b16"
red     = "#dc322f"
magenta = "#d33682"
violet  = "#6c71c4"
blue    = "#268bd2"
cyan    = "#2aa198"
green   = "#859900"

[palettes.solarized_light]
base03  = '#fdf6e3' # Fundal principal
base02  = '#eee8d5' # Fundal secundar / evidențieri
base01  = '#93a1a1' # Text secundar / comentarii
base00  = '#839496' # Text
base0   = '#657b83' # Text principal (întunecat)
base1   = '#586e75' # Text accentuat
base2   = '#073642'
base3   = '#002b36'
yellow  = '#b58900'
orange  = '#cb4b16'
red     = '#dc322f'
magenta = '#d33682'
violet  = '#6c71c4'
blue    = '#268bd2'
cyan    = '#2aa198'
green   = '#859900'

# ── Location ─────────────────────────────────────────────
[directory]
style = "bold blue"
read_only = " ro"
read_only_style = "red"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

# ── Git ──────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "violet"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_state]
style = "bold orange"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
style = "magenta"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_metrics]
disabled = false
added_style = "green"
deleted_style = "red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

[custom.worktree]
when = '[ "$(git rev-parse --git-dir 2>/dev/null)" != "$(git rev-parse --git-common-dir 2>/dev/null)" ]'
shell = ["sh"]
style = "cyan"
format = "[wt]($style) "

# ── Toolchains (only shown inside matching projects) ─────
[nodejs]
symbol = "node "
style = "green"
format = "[$symbol($version)]($style) "

[python]
symbol = "py "
style = "yellow"
format = '[${symbol}${pyenv_prefix}(${version})( \($virtualenv\))]($style) '

[rust]
symbol = "rs "
style = "orange"
format = "[$symbol($version)]($style) "

[golang]
symbol = "go "
style = "cyan"
format = "[$symbol($version)]($style) "

[bun]
symbol = "bun "
style = "base01"
format = "[$symbol($version)]($style) "

[deno]
symbol = "deno "
style = "green"
format = "[$symbol($version)]($style) "

# ── Timing & jobs ────────────────────────────────────────
[cmd_duration]
min_time = 2_000
show_notifications = true
min_time_to_notify = 45_000
style = "base1"
format = "[took $duration]($style) "

[jobs]
symbol = "✦"
style = "cyan"
format = "[$symbol$number]($style) "

# ── Prompt line ──────────────────────────────────────────
[status]
disabled = false
symbol = "✘"
style = "red"
format = "[$symbol $status]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold violet)"

# Off by default to keep the prompt quiet; enable if you want them.
[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[docker_context]
disabled = true

[username]
show_always = false
style_user = "base01"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "bold orange"
format = "[$hostname]($style) "
